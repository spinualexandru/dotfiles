# Window rules (v2 style) — converted from legacy rules while preserving behavior.
# Rules are evaluated top-to-bottom.

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps.
# Legacy: windowrule = suppressevent maximize, class:.*
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland.
# Legacy: windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Fix find in files / dialogs (JetBrains)
# Legacy:
#   windowrulev2=noinitialfocus,class:jetbrains-toolbox, floating:1
#   windowrulev2=noinitialfocus, class:(jetbrains-)(.*), title:^$, initialTitle:^$, floating:1
#   windowrulev2=center, class:(jetbrains-)(.*), title:^$, initialTitle:^$, floating:1
#   windowrulev2=center, class:(jetbrains-)(.*), initialTitle:(.+), floating:1
windowrulev2 = noinitialfocus, class:jetbrains-toolbox, floating:1
windowrulev2 = noinitialfocus, class:(jetbrains-)(.*), title:^$, initialTitle:^$, floating:1
windowrulev2 = center, class:(jetbrains-)(.*), title:^$, initialTitle:^$, floating:1
windowrulev2 = center, class:(jetbrains-)(.*), initialTitle:(.+), floating:1

# Waydroid
# Legacy: windowrule=float, class:^(Waydroid)$
windowrulev2 = float, class:^(Waydroid)$

# Quests
# Legacy:
#   windowrule=float, class:^(Quests)(.*)
#   windowrulev2=center,class:^(Quests)(.*)
windowrulev2 = float, class:^(Quests)(.*)
windowrulev2 = center, class:^(Quests)(.*)

# hyprtoolkit-lua-form
# Legacy: windowrule=float, class:^(hyprtoolkit-lua-form)$
windowrulev2 = float, class:^(hyprtoolkit-lua-form)$
