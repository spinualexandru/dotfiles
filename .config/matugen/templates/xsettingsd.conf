<* if {{ is_dark_mode }} *>
Net/ThemeName "Tokyonight-Dark"
Net/IconThemeName "Colloid-Dark"
<* else *>
Net/ThemeName "Tokyonight-Light"
Net/IconThemeName "Colloid-Light"
<* endif *>
Gtk/CursorThemeName "default"
Net/EnableEventSounds 1
EnableInputFeedbackSounds 0
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintfull"
Xft/RGBA "rgb"
